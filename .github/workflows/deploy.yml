name: Deploy to atharbuild.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail early with a clear message instead of a cryptic FTP error,
      # and tolerate common secret formats (ftp://host, host:21, missing trailing slash).
      - name: Check FTP settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=""
          [ -z "$FTP_SERVER" ] && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

          host="$(echo "$FTP_SERVER" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##')"
          port="21"
          case "$host" in
            *:*) port="${host##*:}"; host="${host%%:*}" ;;
          esac

          dir="$(echo "$FTP_SERVER_DIR" | tr -d '[:space:]')"
          [ -z "$dir" ] && dir="./public_html/"
          case "$dir" in */) ;; *) dir="$dir/" ;; esac

          echo "FTP_HOST=$host" >> "$GITHUB_ENV"
          echo "FTP_PORT=$port" >> "$GITHUB_ENV"
          echo "FTP_DIR=$dir" >> "$GITHUB_ENV"
          echo "Deploying to port $port, dir $dir"

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          port: ${{ env.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_DIR }}
          timeout: 300000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
